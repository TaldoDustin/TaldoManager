<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taldo Manager — Resultados</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css"
  />
  <style>
    body { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    .controles { display: flex; gap: .75rem; align-items: end; flex-wrap: wrap; }
    .controles label { margin: 0; }
    .controles input { width: 8rem; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1rem 0; }
    .cards article { margin: 0; }
    .abas { display: flex; flex-wrap: wrap; gap: .25rem; border-bottom: 1px solid var(--pico-muted-border-color); margin-bottom: 1rem; }
    .abas button { width: auto; margin: 0; border-radius: 6px 6px 0 0; background: transparent; border: none; color: var(--pico-muted-color); padding: .5rem .9rem; }
    .abas button.ativa { color: var(--pico-primary); border-bottom: 2px solid var(--pico-primary); }
    table { font-size: .9rem; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .forma span { font-weight: 700; }
    .V { color: #43a047; } .D { color: #e53935; } .E { color: #fdd835; }
    #erro { color: #e53935; }
    .vazio { color: var(--pico-muted-color); font-style: italic; }
    @media (max-width: 700px) { .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <hgroup>
    <h1>⚽ Taldo Manager</h1>
    <p>Visualização dos resultados da simulação de temporada.</p>
  </hgroup>

  <div class="controles">
    <label>
      API
      <input id="api" type="text" value="http://localhost:8000" style="width: 15rem" />
    </label>
    <label>
      Seed (opcional)
      <input id="seed" type="number" placeholder="aleatório" />
    </label>
    <button id="simular">Simular temporada</button>
  </div>

  <p id="status" aria-busy="false"></p>
  <p id="erro"></p>

  <section id="resultado" hidden>
    <div class="cards">
      <article>
        <header><strong>🏆 Campeão</strong></header>
        <h3 id="campeao" style="margin: 0"></h3>
        <small id="campeao-info"></small>
      </article>
      <article>
        <header><strong>⭐ MVP do campeonato</strong></header>
        <h3 id="mvp" style="margin: 0"></h3>
        <small id="mvp-info"></small>
      </article>
    </div>

    <nav class="abas" id="abas"></nav>
    <div id="painel"></div>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);
    let dados = null;
    let abaAtual = "classificacao";

    const COLUNAS = {
      classificacao: [
        ["posicao", "#"], ["clube", "Clube"], ["pontos", "P"], ["jogos", "J"],
        ["vitorias", "V"], ["empates", "E"], ["derrotas", "D"],
        ["gols_marcados", "GP"], ["gols_sofridos", "GC"], ["saldo_gols", "SG"],
        ["forma", "Forma"],
      ],
      artilharia: [
        ["nome", "Jogador"], ["clube", "Clube"], ["gols", "Gols"],
        ["assistencias", "Assist."], ["nota_media", "Nota"],
      ],
      assistencias: [
        ["nome", "Jogador"], ["clube", "Clube"], ["assistencias", "Assist."],
        ["gols", "Gols"], ["nota_media", "Nota"],
      ],
      melhores_notas: [
        ["nome", "Jogador"], ["clube", "Clube"], ["posicao", "Posição"],
        ["nota_media", "Média"], ["melhor_nota", "Melhor nota"], ["partidas", "Jogos"],
      ],
      clean_sheets: [
        ["nome", "Goleiro"], ["clube", "Clube"], ["clean_sheets", "CS"],
        ["nota_media", "Nota"],
      ],
      hat_tricks: [
        ["nome", "Jogador"], ["clube", "Clube"], ["hat_tricks", "Hat-tricks"],
        ["gols", "Gols"],
      ],
    };

    const ABAS = [
      ["classificacao", "Classificação"],
      ["artilharia", "Artilharia"],
      ["assistencias", "Assistências"],
      ["melhores_notas", "Notas"],
      ["clean_sheets", "Clean Sheets"],
      ["hat_tricks", "Hat-tricks"],
      ["historico", "Histórico"],
      ["recordes", "Recordes"],
    ];

    const ehNumero = (v) => typeof v === "number";

    function celula(valor) {
      if (Array.isArray(valor)) {
        return `<span class="forma">${valor
          .map((r) => `<span class="${r}">${r}</span>`)
          .join(" ")}</span>`;
      }
      return valor;
    }

    function tabela(lista, colunas) {
      if (!lista || lista.length === 0) {
        return `<p class="vazio">Nenhum registro nesta temporada.</p>`;
      }
      const head = colunas
        .map(([k, rot]) => `<th class="${ehNumero(lista[0][k]) ? "num" : ""}">${rot}</th>`)
        .join("");
      const linhas = lista
        .map(
          (item) =>
            `<tr>${colunas
              .map(
                ([k]) =>
                  `<td class="${ehNumero(item[k]) ? "num" : ""}">${celula(item[k])}</td>`
              )
              .join("")}</tr>`
        )
        .join("");
      return `<figure><table><thead><tr>${head}</tr></thead><tbody>${linhas}</tbody></table></figure>`;
    }

    function renderPainel() {
      const painel = $("painel");
      if (abaAtual === "historico") {
        painel.innerHTML = `<figure><table><tbody>${dados.historico
          .map((linha) => `<tr><td>${linha}</td></tr>`)
          .join("")}</tbody></table></figure>`;
        return;
      }
      if (abaAtual === "recordes") {
        const r = dados.recordes;
        painel.innerHTML = `<ul>
          <li><strong>Maior goleada:</strong> ${r.maior_goleada.partida} (${r.maior_goleada.valor} de diferença)</li>
          <li><strong>Mais gols numa partida:</strong> ${r.mais_gols_jogo.partida} (${r.mais_gols_jogo.valor} gols)</li>
        </ul>`;
        return;
      }
      painel.innerHTML = tabela(dados[abaAtual], COLUNAS[abaAtual]);
    }

    function renderAbas() {
      $("abas").innerHTML = ABAS.map(
        ([k, rot]) =>
          `<button data-aba="${k}" class="${k === abaAtual ? "ativa" : ""}">${rot}</button>`
      ).join("");
      $("abas")
        .querySelectorAll("button")
        .forEach((b) =>
          b.addEventListener("click", () => {
            abaAtual = b.dataset.aba;
            renderAbas();
            renderPainel();
          })
        );
    }

    function render() {
      const campeao = dados.classificacao[0];
      $("campeao").textContent = dados.campeao;
      $("campeao-info").textContent = `${campeao.pontos} pts · ${campeao.vitorias}V ${campeao.empates}E ${campeao.derrotas}D · saldo ${campeao.saldo_gols}`;
      const mvp = dados.mvp;
      $("mvp").textContent = mvp ? mvp.nome : "—";
      $("mvp-info").textContent = mvp
        ? `${mvp.clube} · ${mvp.posicao} · nota média ${mvp.nota_media} · ${mvp.melhor_em_campo}x melhor em campo`
        : "";
      renderAbas();
      renderPainel();
      $("resultado").hidden = false;
    }

    async function simular() {
      const api = $("api").value.replace(/\/$/, "");
      const seed = $("seed").value.trim();
      const url = `${api}/simulacao${seed ? `?seed=${encodeURIComponent(seed)}` : ""}`;
      $("erro").textContent = "";
      $("status").setAttribute("aria-busy", "true");
      $("status").textContent = " Simulando temporada (38 rodadas, 380 partidas)...";
      $("simular").disabled = true;
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        dados = await resp.json();
        render();
        $("status").textContent = `Temporada simulada — ${dados.rodadas} rodadas · seed ${dados.seed ?? "aleatório"}`;
      } catch (e) {
        $("status").textContent = "";
        $("erro").textContent =
          `Falha ao chamar ${url} — ${e.message}. A API está rodando? (uvicorn app.main:app --reload)`;
      } finally {
        $("status").setAttribute("aria-busy", "false");
        $("simular").disabled = false;
      }
    }

    $("simular").addEventListener("click", simular);
  </script>
</body>
</html>
